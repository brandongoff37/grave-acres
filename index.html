<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grave Acres</title>
<meta name="description" content="Grow crops, raise a zombie horde, and raid the towns next door.">
<meta name="theme-color" content="#1d1a2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grave Acres">
<style>
/* --tilt is how far the farm leans back; --lean is the same for the battlefield. Pictures that
   stand on either one are turned back by the same angle so they face the player. */
:root{--bg:#1d1a2b;--panel:#2a2540;--ink:#f2ecd9;--muted:#a69fc0;--green:#7bd36b;--gold:#ffcf4a;--red:#ff6b6b;--dirt:#6b4a2e;--dirt2:#5a3d25;--grass:#3f6b35;--tilt:38deg;--turn:-13deg;--lean:50deg}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.ic{width:100%;height:100%;display:block}
.mi{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.mi .ic{width:100%;height:100%}
header{display:flex;gap:6px;align-items:center}
.chip{background:var(--panel);border-radius:999px;padding:6px 10px 6px 7px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px}
.chip .mi{width:18px;height:18px}
.title{font-weight:900;font-size:18px;letter-spacing:.5px;margin-right:auto;display:flex;align-items:center;gap:6px;min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.title .tx{overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.title{font-size:16px}.chip{padding:5px 8px 5px 6px;font-size:13px}.title .tx{display:none}}
.title .mi{width:26px;height:26px}
.iconbtn{width:36px;height:36px;padding:7px;border-radius:999px}
.xpbar{height:6px;background:#00000055;border-radius:3px;margin:8px 0 10px;overflow:hidden}
.xpbar>div{height:100%;background:var(--green);transition:width .3s}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
nav .mi{width:22px;height:22px}
/* Buttons are raised blocks: a dark lip underneath that they sink into when pressed */
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #0000005c;transition:transform .07s,box-shadow .07s}
button.on{background:var(--green);color:#132}
button.gold{background:var(--gold);color:#321}
button.danger{background:var(--red);color:#300}
button.mini{padding:5px 9px;font-size:12px;border-radius:9px;margin-top:5px;background:#7bd36b2e;color:var(--green);box-shadow:0 3px 0 #0000004d}
button:disabled{opacity:.4;box-shadow:none}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 #0000}
.view{display:none;flex:1}.view.show{display:block}
.toolbar{display:flex;gap:8px;margin-top:10px}
.toolbar button{flex:1}

/* ---------- The farm is a graveyard: a patch of ground that leans back, with graves dug into it.
   #yard is the ground. Everything standing on it (headstones, crops, fence, tree, lanterns) is turned
   back by the same angle so it faces the player. ---------- */
/* The camera stands off to one side, low, and holds still: --turn swings the yard so its right side
   comes toward you, --tilt lays it back. Only the wind moves things (the tree and anything wooden). */
#fieldWrap{perspective:900px;perspective-origin:50% -10%;margin-top:64px;padding:0 22px 26px}
#yard{position:relative;transform:rotateY(var(--turn)) rotateX(var(--tilt));transform-origin:50% 100%;transform-style:preserve-3d;border-radius:14px;
  background:radial-gradient(60px 40px at 18% 30%,#4f6b4a66,#0000 70%),radial-gradient(80px 50px at 82% 62%,#4f6b4a55,#0000 70%),radial-gradient(70px 46px at 40% 88%,#5a5a7a44,#0000 70%),linear-gradient(#2f3d3a,#3a4d3c 60%,#33443a);
  box-shadow:inset 0 0 0 3px #0000004d,inset 0 0 40px #0b0a1499}
/* the front of the ground: a low stone wall */
#yard::after{content:"";position:absolute;left:6px;right:6px;top:100%;height:26px;border-radius:0 0 8px 8px;transform-origin:50% 0;transform:rotateX(-90deg);
  background:repeating-linear-gradient(90deg,#0000 0 30px,#1b162688 30px 32px),linear-gradient(#6b6590,#3c3856)}
#field{padding:28px 12px 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px;position:relative;transform-style:preserve-3d}
/* iron fence along the back, with the gate and a dead tree */
.gy-back{position:absolute;left:4px;right:4px;bottom:calc(100% - 6px);height:50px;background:var(--fence) 0 100%/50px 50px repeat-x;transform-origin:50% 100%;transform:rotateX(calc(var(--tilt) * -1));transform-style:preserve-3d;pointer-events:none}
.gy-gate{position:absolute;left:50%;bottom:-2px;width:92px;height:92px;margin-left:-46px;transform:translateZ(1px)}
/* the dead oak stands just outside the back corner; gusts bend it from the roots up */
.gy-tree{position:absolute;left:-12%;bottom:-4px;width:150px;height:150px;transform:translateZ(-14px);transform-origin:50% 96%;animation:gust 9s ease-in-out infinite}
@keyframes gust{0%,100%{transform:translateZ(-14px) skewX(0) rotateZ(-.4deg)}18%{transform:translateZ(-14px) skewX(-2.6deg) rotateZ(.8deg)}28%{transform:translateZ(-14px) skewX(-1deg) rotateZ(.2deg)}
  42%{transform:translateZ(-14px) skewX(-4deg) rotateZ(1.2deg)}58%{transform:translateZ(-14px) skewX(-.6deg) rotateZ(-.2deg)}76%{transform:translateZ(-14px) skewX(-1.8deg) rotateZ(.5deg)}}
/* fences down both sides stand straight up out of the ground */
.gy-side{position:absolute;top:-44px;left:2px;height:44px;width:var(--fh,400px);background:var(--fence) 0 100%/44px 44px repeat-x;transform-origin:0 100%;transform:rotateZ(90deg) rotateX(-90deg);pointer-events:none}
.gy-side.r{left:calc(100% - 2px)}
.gy-lamp{position:absolute;bottom:-6px;width:88px;height:88px;transform-origin:50% 100%;transform:rotateX(calc(var(--tilt) * -1)) translateZ(2px);pointer-events:none}
.gy-lamp.l{left:-36px}.gy-lamp.r{right:-36px}
.gy-lamp svg{animation:flick 3.1s steps(1) infinite}
@keyframes flick{0%,100%{filter:none}43%{filter:brightness(1.25)}47%{filter:brightness(.85)}52%{filter:brightness(1.2)}}
/* ground fog hangs just above the dirt, so headstones and crops poke up through it */
.fog{position:absolute;inset:-6px;border-radius:20px;pointer-events:none;transform:translateZ(16px);
  background:radial-gradient(90px 34px at 20% 30%,#cfd3ff2b,#0000 70%),radial-gradient(120px 40px at 75% 55%,#cfd3ff24,#0000 70%),radial-gradient(100px 36px at 40% 85%,#cfd3ff26,#0000 70%);
  background-size:200% 100%;animation:drift 26s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:200% 0}}
.wisp{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(#f4ffd9,#a8ff7a 45%,#a8ff7a00 70%);pointer-events:none;animation:wisp 9s ease-in-out infinite}
.wisp.b{animation-duration:13s;animation-delay:-5s}
@keyframes wisp{0%,100%{transform:translate3d(0,0,30px);opacity:0}15%{opacity:.9}50%{transform:translate3d(70px,-90px,64px);opacity:.7}85%{opacity:.9}}
/* a grave: a low bed of dirt with a headstone standing at its head */
.plot{aspect-ratio:1;border-radius:38% 38% 10px 10px/20% 20% 10px 10px;background:repeating-linear-gradient(0deg,var(--dirt) 0 8px,var(--dirt2) 8px 16px);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;padding:0 0 13%;box-shadow:inset 0 0 0 2px #2a1a0e99;transform-style:preserve-3d;transform:translateZ(9px);transition:transform .12s}
.plot::after{content:"";position:absolute;left:5px;right:5px;top:100%;height:9px;background:linear-gradient(#4a321e,#291a0f);border-radius:0 0 4px 4px;transform-origin:50% 0;transform:rotateX(-90deg)}
.plot:active:not(:disabled){transform:translateZ(2px);box-shadow:inset 0 0 0 2px #2a1a0e99}
.plot .hs{position:absolute;left:50%;bottom:calc(100% - 9px);width:50%;aspect-ratio:1;margin-left:-25%;transform-origin:50% 100%;transform:rotateX(calc(var(--tilt) * -1));transform-style:preserve-3d;pointer-events:none}
.plot .hs>svg{position:relative;filter:drop-shadow(0 3px 2px #0007)}
/* each headstone is a slab: two darker copies behind the face give it a visible edge from the side */
.plot .hs>i{position:absolute;inset:0;transform:translateZ(-2.4px)}.plot .hs>i+i{transform:translateZ(-4.8px)}
.plot .hs>i svg{filter:brightness(.42) saturate(.6)}
/* wooden markers rock in the wind, each on its own beat */
.plot .hs.wood{transform-origin:50% 96%;animation:rock 6.5s var(--d,0s) ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotateX(calc(var(--tilt) * -1)) rotateZ(-.6deg)}30%{transform:rotateX(calc(var(--tilt) * -1)) rotateZ(1.8deg)}45%{transform:rotateX(calc(var(--tilt) * -1)) rotateZ(.6deg)}62%{transform:rotateX(calc(var(--tilt) * -1)) rotateZ(2.2deg)}}
.plot.fresh .hs{animation:thump .5s ease-out}
@keyframes thump{0%{transform:rotateX(calc(var(--tilt) * -1)) translateZ(46px)}55%{transform:rotateX(calc(var(--tilt) * -1 + 16deg))}80%{transform:rotateX(calc(var(--tilt) * -1 - 8deg))}}
.plot .art{width:70%;height:70%;flex:none;transform-origin:50% 88%;transform:rotateX(calc(var(--tilt) * -1)) translateZ(2px);animation:popIn .42s cubic-bezier(.3,1.5,.5,1) backwards}
.plot.ready .art,.plot.warn .art{animation:popIn .42s cubic-bezier(.3,1.5,.5,1) backwards,hop 1.1s .42s ease-in-out infinite}
/* an open grave waiting for a seed */
.plot.empty{background:radial-gradient(ellipse at 50% 58%,#1c120a 0 38%,#3b2716 62%,var(--dirt2) 64%);justify-content:center;padding:14% 0 0}
/* ground that hasn't been cleared yet: flat and overgrown */
.plot.locked{background:#00000026;box-shadow:inset 0 0 0 2px #ffffff14;font-size:12px;color:#ffffffaa;font-weight:700;transform:none;justify-content:center;padding:0;border-radius:10px;aspect-ratio:auto;min-height:calc(.135 * min(100vw,520px));flex-direction:row;gap:4px}
.plot.locked::after{display:none}
.plot.locked .art{width:30%;height:auto;aspect-ratio:1;animation:none;transform-origin:50% 100%}
.plot.locked .wd{position:absolute;left:6%;bottom:40%;width:44%;aspect-ratio:1;transform-origin:50% 100%;transform:rotateX(calc(var(--tilt) * -1));pointer-events:none}
.plot.locked .wd.b{left:auto;right:4%;bottom:6%;width:38%}

.plot .plus{font-size:28px;font-weight:900;line-height:1;color:#ffffff3d}
.plot .bar{position:absolute;left:8px;right:8px;bottom:5px;height:6px;background:#0006;border-radius:3px}
.plot .bar>div{height:100%;background:var(--green);border-radius:3px;transition:width .5s linear}
.plot .tm{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;transform-origin:50% 100%;transform:rotateX(calc(var(--tilt) * -1)) translateZ(3px)}
.plot.ready{box-shadow:0 0 0 3px var(--gold)}
.plot .wet{position:absolute;bottom:14px;right:5px;width:15px;height:15px;transform:translateZ(1px)}
.plot .wet.dry{opacity:.3;filter:grayscale(1);animation:blink 1.4s ease-in-out infinite}
.plot.warn{animation:warn .6s steps(2) infinite}
.plot.wither{background:repeating-linear-gradient(0deg,#4d3a2a 0 8px,#45331f 8px 16px)}
@keyframes popIn{from{transform:rotateX(calc(var(--tilt) * -1)) translateZ(70px) scale(.25);opacity:0}}
@keyframes hop{0%,100%{transform:rotateX(calc(var(--tilt) * -1)) translateZ(2px)}45%{transform:rotateX(calc(var(--tilt) * -1)) translateY(-11px) translateZ(12px) rotateZ(4deg)}70%{transform:rotateX(calc(var(--tilt) * -1)) translateY(-2px) translateZ(4px) rotateZ(-3deg)}}
@keyframes warn{50%{box-shadow:0 0 0 3px var(--red)}}
@keyframes blink{50%{opacity:.6}}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:10px 0;line-height:1.4}

/* ---------- Sheets ---------- */
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:10;perspective:900px}
.sheet.show{display:flex}
.sheet>div{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);max-height:82vh;overflow:auto;transform-origin:50% 100%;animation:sheetUp .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(45%) rotateX(-22deg);opacity:0}}
.sheet h3{margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sheet h3 .mi{width:28px;height:28px}
.sheet h4{margin:12px 0 6px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.sheet p{color:var(--muted);line-height:1.5}
.row{display:flex;align-items:center;gap:10px;background:#00000033;border-radius:12px;padding:8px 10px;margin-bottom:8px}
.row .em{width:46px;height:46px;flex:none}
.row .info{flex:1;font-size:13px;color:var(--muted)}
.row .info b{color:var(--ink);font-size:15px;display:block}
.row.lock{opacity:.45}
.row button{white-space:nowrap}
.horde{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:700px}
.zcard{background:var(--panel);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;position:relative;cursor:pointer;box-shadow:0 4px 0 #0000005c;transition:transform .1s}
.zcard:active{transform:translateY(3px) rotateX(14deg)}
.zcard .e{width:52px;height:52px;margin:0 auto 2px}
.zcard .e{position:relative}
#hordeList .zcard .e::before{content:"";position:absolute;left:6%;right:6%;bottom:-5px;height:12px;border-radius:50%;background:radial-gradient(#000000a6,#0000 70%)}
#hordeList .zcard .e svg{position:relative}
#hordeList .zcard .e{animation:sway 2.6s ease-in-out infinite}
#hordeList .zcard:nth-child(3n+1) .e{animation-delay:-.9s}
#hordeList .zcard:nth-child(3n+2) .e{animation-delay:-1.7s}
@keyframes sway{0%,100%{transform:perspective(160px) rotateY(-14deg)}50%{transform:perspective(160px) rotateY(14deg) translateY(-3px)}}
.mut .e svg,.u.mut svg{filter:drop-shadow(0 0 4px #ffcf4a)}
.badge{position:absolute;top:4px;right:4px;width:16px;height:16px}

/* ---------- The battlefield: a patch of ground seen from above and behind your horde ---------- */
#battle{background:#151222;border-radius:16px;padding:10px}
.stage{position:relative;perspective:640px;perspective-origin:50% 0;overflow:hidden;border-radius:14px;padding:46px 6px 6px;background:radial-gradient(120% 70% at 50% 0,#3a2f5c 0,#1c1830 60%,#151222 100%)}
.stage::before{content:"";position:absolute;right:26px;top:10px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8d8,#e6d9a0);box-shadow:0 0 18px 4px #fff3b055}
.vs{z-index:2;position:absolute;left:12px;right:64px;top:12px;color:var(--ink);font-weight:800;font-size:15px;text-shadow:0 2px 0 #0008}
.ground{position:relative;border-radius:18px;margin-top:-58px;padding:20px 4px 16px;transform:rotateX(var(--lean));transform-origin:50% 100%;transform-style:preserve-3d;
  background:repeating-linear-gradient(0deg,#ffffff0a 0 14px,#0000 14px 28px),linear-gradient(#4b5a3a,#3b4a31 46%,#5a4630 50%,#3a3145 54%,#2f2940);box-shadow:inset 0 0 0 3px #0000003d}
.side{display:flex;flex-wrap:wrap;gap:16px 4px;justify-content:center;min-height:62px;transform-style:preserve-3d}
.mid{height:44px}
/* The town's rooftops stand along the far edge of the field */
.skyline{position:absolute;left:6%;right:6%;bottom:100%;height:46px;display:flex;justify-content:space-around;align-items:flex-end;transform-origin:50% 100%;transform:rotateX(calc(var(--lean) * -1));opacity:.5;filter:brightness(.55) saturate(.7)}
.skyline span{width:40px;height:40px}
.skyline span:nth-child(even){width:52px;height:52px}
.u{width:54px;text-align:center;position:relative;transform-style:preserve-3d}
.u::before{content:"";position:absolute;left:9px;right:9px;bottom:-5px;height:13px;border-radius:50%;background:radial-gradient(#000000a6,#0000 70%);transition:opacity .4s}
.u .b{transform-origin:50% 100%;transform:rotateX(calc(var(--lean) * -1));transition:transform .5s cubic-bezier(.55,0,.9,.6),opacity .5s,filter .5s}
.u .a{width:50px;height:50px;margin:0 auto}
.u .hp{height:5px;width:40px;margin:0 auto 3px;background:#000a;border-radius:3px;overflow:hidden}
.u .hp>div{height:100%;background:var(--green);border-radius:3px;transition:width .2s}
.foe .hp>div{background:var(--red)}
/* A fallen fighter tips over and lies flat on the ground */
.u.dead .b{transform:rotateX(0deg) rotateZ(7deg);opacity:.4;filter:grayscale(1)}
.u.dead:nth-child(even) .b{transform:rotateX(0deg) rotateZ(-9deg)}
.u.dead .hp{visibility:hidden}
.u.dead::before{opacity:0}
.u.cheer .b{animation:cheer .42s ease-in-out infinite alternate}
.u.cheer:nth-child(even) .b{animation-delay:.2s}
@keyframes cheer{to{transform:rotateX(calc(var(--lean) * -1)) translateY(-11px)}}
.u .fx{position:absolute;inset:0;transform-origin:50% 100%;transform:rotateX(calc(var(--lean) * -1)) translateZ(4px);pointer-events:none}
.dmg{position:absolute;left:50%;top:0;transform:translate(-50%,-14px);font-weight:900;font-size:17px;color:#ff9a9a;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap}
.dmg.heal{color:var(--green)}
.dmg.crit{color:var(--gold);font-size:23px}
.dmg.txt{color:#fff;font-size:12px}
.ring{position:absolute;left:50%;bottom:-12px;width:46px;height:26px;margin-left:-23px;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:ring .45s ease-out forwards}
.ring.crit{border-color:var(--gold);border-width:4px}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(1.9);opacity:0}}
.skyline.yard{opacity:.8;filter:brightness(.8)}
.stage.shake{animation:shake .28s}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
#result{display:none;perspective:600px;margin-top:10px}
#result.show{display:block}
#result .card{border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 5px 0 #0007;transform-origin:50% 0;animation:flipIn .55s cubic-bezier(.2,1.3,.4,1) both}
#result .card.win{background:linear-gradient(#3d7335,#27502a)}
#result .card.lose{background:linear-gradient(#6a2f38,#45202a)}
#result h2{margin:0;font-size:26px;letter-spacing:1.5px;text-shadow:0 3px 0 #0008}
#result p{margin:6px 0 0;font-size:13px;color:#ffffffcc;line-height:1.4}
.loot{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.loot .chip{background:#00000047}
@keyframes flipIn{from{transform:rotateX(-88deg);opacity:0}}
#log{font-size:12px;color:var(--muted);height:66px;overflow:auto;margin-top:8px;line-height:1.45}
.odds{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:3px}

/* ---------- Pop-ups and flying bits ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);transform:translateX(-50%);background:var(--gold);color:#321;font-weight:800;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;width:max-content;max-width:92vw;text-align:center;box-shadow:0 4px 0 #0006}
#toast.show{opacity:1}
.float{position:fixed;pointer-events:none;font-weight:900;color:var(--gold);animation:up .9s forwards;z-index:15;text-shadow:0 2px 4px #000;display:flex;align-items:center;gap:3px}
.float .mi{width:18px;height:18px}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.fly{position:fixed;pointer-events:none;z-index:18}
.chip.bump,nav button.bump{animation:bump .4s}
.chip.bump .mi{animation:spinY .5s}
@keyframes bump{35%{transform:scale(1.22)}}
@keyframes spinY{from{transform:perspective(80px) rotateY(0)}to{transform:perspective(80px) rotateY(360deg)}}
#lvlUp{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 104px);display:flex;justify-content:center;pointer-events:none;z-index:25;perspective:700px;padding:0 16px}
#lvlUp .card{display:flex;align-items:center;gap:12px;background:linear-gradient(#ffe07a,#f2b632);color:#321;border-radius:16px;padding:12px 18px 12px 12px;font-size:13px;font-weight:700;line-height:1.4;box-shadow:0 6px 0 #9a6a10,0 14px 30px #000a;animation:lvl 3.2s both}
#lvlUp .st{width:54px;height:54px;flex:none;animation:spinY 1.1s ease-out}
#lvlUp b{display:block;font-size:22px;font-weight:900}
@keyframes lvl{0%{transform:rotateY(-95deg) scale(.6);opacity:0}9%{transform:rotateY(14deg) scale(1.06);opacity:1}15%{transform:none}86%{transform:none;opacity:1}100%{transform:translateY(-26px) rotateX(50deg);opacity:0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stats div{background:#00000033;border-radius:10px;padding:8px;font-size:13px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:17px}

nav button{position:relative}
.nb{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.nb.gold{background:var(--gold);color:#321}
#goal{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--muted);position:relative;z-index:1}
#goal .em{width:34px;height:34px;flex:none}
#goal b{color:var(--ink);display:block;font-size:14px}
#goal .gbar{height:5px;background:#0006;border-radius:3px;margin-top:4px;overflow:hidden}
#goal .gbar>div{height:100%;background:var(--gold)}
#mobBanner{display:none;align-items:center;gap:10px;background:#4a1f24;border:1px solid #ff6b6b66;border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:#ffd6d6}
#mobBanner .em{width:30px;height:30px;flex:none}
.zcard.sel{box-shadow:0 0 0 3px var(--green),0 4px 0 #0000005c}
.zcard.off{opacity:.45}
.ab{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:#ffffff1a;color:var(--ink);margin-top:3px}
textarea{width:100%;height:90px;border-radius:10px;border:0;background:#00000044;color:var(--ink);font:12px ui-monospace,monospace;padding:8px;user-select:text;-webkit-user-select:text}
.sheet .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.sumrow{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.sumrow .s{width:40px;height:40px}
/* ---------- Title screen ---------- */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;overflow:auto;background:radial-gradient(120% 60% at 50% 0,#3a2f5c 0,#1c1830 55%,#12101d 100%);padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);transition:opacity .45s,transform .45s}
#title.gone{opacity:0;transform:scale(1.15);pointer-events:none}
.t-top{position:relative;width:100%;max-width:420px;flex:none;perspective:700px}
.t-moon{position:absolute;right:8%;top:6px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8d8,#e6d9a0);box-shadow:0 0 40px 10px #fff3b040}
.t-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:blink 2.4s ease-in-out infinite}
.t-logo{margin:54px 0 0;text-align:center;font-weight:900;line-height:.88;letter-spacing:2px;text-transform:uppercase;color:#a8ff7a;font-size:min(17vw,76px);transform-origin:50% 100%;animation:logo 5s ease-in-out infinite;
  text-shadow:0 1px 0 #5fae45,0 2px 0 #5fae45,0 3px 0 #4b9238,0 4px 0 #4b9238,0 5px 0 #37702a,0 6px 0 #37702a,0 7px 0 #1b1626,0 14px 18px #000a}
.t-logo span{display:block}.t-logo span+span{color:#f2ecd9;text-shadow:0 1px 0 #b9b0cf,0 2px 0 #b9b0cf,0 3px 0 #8d86a8,0 4px 0 #8d86a8,0 5px 0 #6b6590,0 6px 0 #6b6590,0 7px 0 #1b1626,0 14px 18px #000a}
@keyframes logo{0%,100%{transform:rotateX(14deg) rotateY(-7deg)}50%{transform:rotateX(8deg) rotateY(7deg) translateY(-5px)}}
.t-scene{position:relative;height:150px;margin-top:6px}
.t-scene::before{content:"";position:absolute;left:-4%;right:-4%;bottom:26px;height:44px;background:var(--fence) 0 100%/44px 44px repeat-x;opacity:.7}
.t-scene::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:84px;border-radius:50%;background:linear-gradient(#3a4d3c,#232e2b);box-shadow:inset 0 3px 0 #0005}
.t-scene span{position:absolute;bottom:20px;z-index:1}
.t-tree{left:0;width:120px;height:120px}
.t-hand{left:50%;width:124px;height:124px;margin-left:-62px;bottom:6px!important;transform-origin:50% 100%;animation:rise 3.4s ease-in-out infinite}
@keyframes rise{0%,100%{transform:translateY(8px) rotate(-4deg)}50%{transform:translateY(-4px) rotate(5deg)}}
.t-s{width:58px;height:58px}.t-s.a{left:24%}.t-s.b{right:20%;width:66px;height:66px}.t-s.c{right:3%;width:50px;height:50px}
.t-menu{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin-top:22px;position:relative;z-index:2}
.t-menu .hint{margin:0}
#playBtn{font-size:22px;padding:14px;letter-spacing:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #0000005c,0 0 22px 4px #ffcf4a99}}
.t-menu .toolbar{margin:0}
#titlePanel{background:#00000040;border-radius:12px;padding:0 12px;font-size:13px;color:var(--muted);line-height:1.5}
#titlePanel:empty{display:none}
#titlePanel .snd{padding:10px 0}
/* volume sliders */
.vol{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;font-weight:700;color:var(--ink)}
.vol span{width:104px;flex:none}.vol output{width:42px;flex:none;text-align:right;color:var(--muted);font-size:13px}
.vol input{flex:1;min-width:0;height:28px;accent-color:var(--gold);touch-action:pan-y}
.snd.muted .vol{opacity:.4}
/* ---------- Landscape phones: the main way to play ----------
   The screen is wide and short, so the tabs become a rail down the left side, the graveyard takes
   the middle, and the goal and buttons sit in a column on the right. The graveyard is laid out
   five graves across and four deep, with wider, shallower graves, so it fills a wide screen. */
@media (orientation:landscape) and (max-height:600px){
  #app{max-width:none;height:100vh;height:100dvh;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:10px;
    padding:calc(env(safe-area-inset-top) + 6px) max(10px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(10px,env(safe-area-inset-left))}
  header,.xpbar{grid-column:1/-1}
  .xpbar{margin:6px 0 8px}
  .title .tx{display:inline}
  nav{grid-column:1;grid-row:3;flex-direction:column;margin:0;width:76px;align-self:start}
  nav button{flex:none;flex-direction:column;gap:2px;padding:8px 4px;font-size:13px}
  nav .mi{width:26px;height:26px}
  .view{grid-column:2;grid-row:3;min-height:0;overflow:auto;overscroll-behavior:contain}
  .hint{margin:6px 0}

  /* Harvest: graveyard on the left, everything else in a narrow column on the right */
  #v-farm.show{display:grid;grid-template-columns:minmax(0,1fr) 168px;grid-template-rows:auto auto auto 1fr;column-gap:12px;align-content:start;overflow:hidden}
  #v-farm>#mobBanner{grid-column:2;grid-row:1}
  #v-farm>#goal{grid-column:2;grid-row:2}
  #v-farm>.toolbar{grid-column:2;grid-row:3;margin-top:0!important}
  #v-farm>.hint{grid-column:2;grid-row:4;text-align:left;font-size:12px;margin-top:10px}
  #v-farm>#fieldWrap{grid-column:1;grid-row:1/span 4}
  #goal{flex-direction:column;align-items:flex-start;gap:6px;padding:8px 10px}
  #goal>div{width:100%}
  #harvestAll{padding:12px 10px}

  :root{--tilt:56deg;--turn:-10deg}
  /* the yard's depth grows with its width, so cap the width by the screen's height to keep it all on screen */
  #fieldWrap{margin-top:44px;padding:0 30px 4px;perspective:1400px;perspective-origin:50% -20%;width:100%;max-width:calc((100vh - 128px) * 1.6 + 60px);max-width:calc((100dvh - 128px) * 1.6 + 60px);justify-self:center}
  #field{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 8px;padding:22px 10px 8px}
  .plot{aspect-ratio:1.6}
  .plot .hs{width:34%;margin-left:-17%}
  .plot .art{width:50%;height:auto;aspect-ratio:1}
  .plot.empty{padding:6% 0 0}
  .plot.locked{min-height:0;aspect-ratio:1.6}
  .plot.locked .wd{width:34%}.plot.locked .wd.b{width:30%}
  .plot .tm{bottom:8px}
  .gy-back{height:44px;background-size:44px 44px}
  .gy-gate{width:80px;height:80px;margin-left:-40px}
  .gy-tree{width:124px;height:124px;left:-8%}
  .gy-side{top:-36px;height:36px;background-size:36px 36px}
  .gy-lamp{width:70px;height:70px}.gy-lamp.l{left:-32px}.gy-lamp.r{right:-32px}

  /* Horde: more zombies to a row */
  .horde{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}

  /* Raid: the battlefield on the left, the play-by-play and buttons on the right */
  #battle{display:grid;grid-template-columns:minmax(0,1fr) 220px;grid-template-rows:auto 1fr auto;column-gap:12px;padding:8px}
  #battle>.stage{grid-column:1;grid-row:1/span 3}
  #battle>#result{grid-column:2;grid-row:1;margin-top:0}
  #battle>#log{grid-column:2;grid-row:2;height:auto;min-height:60px;margin-top:6px}
  #battle>.toolbar{grid-column:2;grid-row:3;flex-direction:column;gap:6px}
  #result h2{font-size:20px}
  .stage{padding-top:40px}

  /* Pop-up sheets: a little wider, still clear of the edges */
  .sheet .grid4{grid-template-columns:repeat(6,minmax(0,1fr))}
  .sheet>div{max-width:640px;max-height:88vh;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}

  .rotate-hint{display:none}
}
/* Small phones on their side: a slimmer tab rail and side column leave more room for the graves */
@media (orientation:landscape) and (max-height:600px) and (max-width:740px){
  nav{width:64px}nav button{font-size:11px;padding:7px 2px}nav .mi{width:22px;height:22px}
  #v-farm.show{grid-template-columns:minmax(0,1fr) 148px}
  .title{font-size:16px}
}
/* The title screen is a portrait screen. In portrait on a phone it says to turn the phone sideways after Play.
   If the phone is already sideways, the same upright layout is kept and simply scrolls. */
.rotate-hint{display:none}
@media (orientation:portrait) and (max-width:600px) and (pointer:coarse){.rotate-hint{display:flex;align-items:center;justify-content:center;gap:8px}}
.rotate-hint .ph{width:22px;height:14px;border:2px solid currentColor;border-radius:3px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
/* People who ask their phone for less motion keep the 3D look but nothing moves on its own */
@media (prefers-reduced-motion:reduce){.t-logo,.t-hand,.t-star,#playBtn,.rotate-hint .ph{animation:none}#title{transition:none}#fieldWrap,.gy-tree,.plot .hs.wood,.gy-lamp svg,.fog,.wisp,.plot.fresh .hs,.ring{animation:none}.wisp{display:none}.plot .art,.plot.ready .art,.plot.warn .art,.plot.warn,.plot .wet.dry,#hordeList .zcard .e,.u.cheer .b,.stage.shake,.sheet>div,#result .card,.chip.bump,.chip.bump .mi,nav button.bump,#lvlUp .st{animation:none}#lvlUp .card{animation:lvlStill 3.2s both}.u .b{transition:none}}
@keyframes lvlStill{0%,90%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="mi" id="logo"></span><span class="tx">Grave Acres</span></div>
    <div class="chip" aria-label="Level"><span class="mi" data-art="star"></span><span id="lvl">1</span></div>
    <div class="chip" aria-label="Coins"><span class="mi" data-art="coin"></span><span id="coins">0</span></div>
    <div class="chip" aria-label="Bones"><span class="mi" data-art="bone"></span><span id="bones">0</span></div>
    <button class="iconbtn" id="menuBtn" aria-label="Menu"><span class="mi" data-art="gear" style="width:100%;height:100%"></span></button>
  </header>
  <div class="xpbar" aria-label="Experience"><div id="xp"></div></div>
  <nav>
    <button data-v="farm" class="on"><span class="mi" data-art="sprout"></span>Harvest<span class="nb gold" id="nbFarm" hidden></span></button>
    <button data-v="horde"><span class="mi" data-art="shamb"></span>Horde</button>
    <button data-v="raid"><span class="mi" data-art="swords"></span>Raid<span class="nb" id="nbRaid" hidden>!</span></button>
  </nav>

  <section class="view show" id="v-farm">
    <div id="mobBanner"><div class="em" data-art="torch"></div><div id="mobTxt"></div></div>
    <div id="goal"></div>
    <div id="fieldWrap"><div id="yard">
      <div class="gy-back" aria-hidden="true"><span class="gy-tree" data-art="tree"></span><span class="gy-gate" data-art="gate"></span></div>
      <div class="gy-side" aria-hidden="true"></div><div class="gy-side r" aria-hidden="true"></div>
      <div id="field"></div>
      <span class="gy-lamp l" data-art="lamp" aria-hidden="true"></span><span class="gy-lamp r" data-art="lamp" aria-hidden="true"></span>
      <div class="fog" aria-hidden="true"></div><span class="wisp" style="left:16%;top:70%" aria-hidden="true"></span><span class="wisp b" style="left:58%;top:86%" aria-hidden="true"></span>
    </div></div>
    <div class="toolbar" style="margin-top:16px">
      <button id="harvestAll" class="gold">Harvest all</button>
    </div>
    <div class="hint">Tap an open grave (<b>+</b>) to plant. Tap something growing to water it once, so it grows faster. Harvest crops before they wither. Flashing red means hurry!</div>
  </section>

  <section class="view" id="v-horde">
    <div class="hint" id="hordeInfo"></div>
    <div class="horde" id="hordeList"></div>
    <div id="serumWrap"></div>
  </section>

  <section class="view" id="v-raid">
    <div id="raidPick"></div>
    <div id="battle" style="display:none">
      <div class="stage" id="stage">
        <div class="vs" id="vsTxt">VS</div>
        <div class="ground">
          <div class="skyline" id="skyline" aria-hidden="true"></div>
          <div class="side" id="foes"></div>
          <div class="mid"></div>
          <div class="side" id="mine"></div>
        </div>
      </div>
      <div id="result"></div>
      <div id="log"></div>
      <div class="toolbar">
        <button id="speedBtn">Speed ×1</button>
        <button id="skipBtn">Skip to result</button>
        <button id="battleDone" class="gold" style="display:none">Back to the towns</button>
      </div>
    </div>
  </section>
</div>

<div id="title">
  <div class="t-top" aria-hidden="true">
    <div class="t-moon"></div><i class="t-star" style="left:8%;top:20px"></i><i class="t-star" style="left:30%;top:6px;animation-delay:-.8s"></i><i class="t-star" style="left:55%;top:30px;animation-delay:-1.5s"></i><i class="t-star" style="left:16%;top:48px;animation-delay:-2s"></i>
    <h1 class="t-logo"><span>Grave</span><span>Acres</span></h1>
    <div class="t-scene"><span class="t-tree" data-art="tree"></span><span class="t-s a" data-art="garg0"></span><span class="t-s b" data-art="stone0"></span><span class="t-s c" data-art="wood2"></span><span class="t-hand" data-art="hand"></span></div>
  </div>
  <div class="t-menu">
    <div class="hint" id="titleInfo"></div>
    <div class="hint rotate-hint"><span class="ph" aria-hidden="true"></span>Tap Play, then turn your phone sideways</div>
    <button class="gold" id="playBtn">Play</button>
    <div class="toolbar"><button id="tSound">Sound</button><button id="tHow">How to play</button></div>
    <div id="titlePanel"></div>
  </div>
</div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lvlUp" role="status" aria-live="polite"></div>

<script src="art.js?v=15"></script>
<script src="game.js?v=15"></script>
</body>
</html>
